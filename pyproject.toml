[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-routerlab"
dynamic = ["version"]
description = "Numerical auditing for mixture-of-experts routers: reference routers, margin certificates, tolerance-aware tests, and precision sweeps"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "RouterLab contributors" }]
keywords = ["mixture-of-experts", "moe", "router", "numerics", "llm", "inference", "bf16", "fp8", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
gpu = ["torch>=2.8", "triton>=3.4; sys_platform == 'linux'"]
test = ["pytest>=7"]
dev = ["pytest>=7", "ml_dtypes>=0.3", "safetensors>=0.4", "ruff>=0.5"]

[project.scripts]
routerlab = "routerlab.cli:main"

[project.urls]
Homepage = "https://github.com/upalchowdhury/routerlab"
Issues = "https://github.com/upalchowdhury/routerlab/issues"
Changelog = "https://github.com/upalchowdhury/routerlab/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "routerlab._version.__version__" }

[tool.setuptools.packages.find]
include = ["routerlab*"]

[tool.setuptools.package-data]
routerlab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning:routerlab.*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
