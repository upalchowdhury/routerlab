name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # weekly: catch transformers/torch drift and run the long fuzzing profile

permissions:
  contents: read

jobs:
  core:
    name: core / py${{ matrix.python }} / numpy ${{ matrix.numpy }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", numpy: "1.24.*" }
          - { os: ubuntu-latest, python: "3.11", numpy: "1.26.*" }
          - { os: ubuntu-latest, python: "3.12", numpy: "2.*" }
          - { os: ubuntu-latest, python: "3.13", numpy: "2.*" }
          - { os: macos-latest, python: "3.12", numpy: "2.*" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (NumPy only, plus test tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==${{ matrix.numpy }}" pytest hypothesis ml_dtypes .
      - name: Test
        run: python -m pytest -q
      - name: Demo
        run: routerlab demo

  integration:
    name: integration / torch + transformers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=5" safetensors ml_dtypes pytest hypothesis -e .
      - name: Test (including transformers parity and capture)
        run: python -m pytest -q -rs
      - name: Long property-based fuzzing (scheduled runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: HYPOTHESIS_PROFILE=stress python -m pytest -q tests/test_properties.py
      - name: Examples
        run: python -m pytest -q examples/test_router_kernel.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check routerlab tests examples
